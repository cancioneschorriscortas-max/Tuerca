<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Sen número de versión no markup: ponno aplicarIdioma() desde TUERCA_V
     (js/00-preambulo.js), a fonte única. Así non pode quedar rancio. -->
<title>TUERCA</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<h1>■ TUERCA <span id="vHangar" style="font-size:12px; color:#7fdc7f; letter-spacing:1px;"></span></h1>
<div class="sub" id="subTitle"><!-- énchese en aplicarIdioma(): versión + lema no idioma activo --></div>

<!-- ===================== HANGAR ===================== -->
<div id="hangar" class="scr">
 <div id="hangarLayout">
  <!-- (v0.71) Columna de estado: non engade datos novos, saca á luz os
       que o xogo xa calculaba e non ensinaba. Énchea estadoRender(). -->
  <aside id="estadoPanel"></aside>
  <div id="hangarCentro">
  <h2><span id="hgTitle">// Hangar — Roster persistente</span> <span id="chatarraDisplay" style="float:right; font-size:14px; color:#c8a86a;"></span></h2>
  <div id="rosterList" class="small"><!-- hg.cargando: énchese ao renderizar --></div>

  <!-- (v0.68) Acción principal soa: é a única que se preme sempre. -->
  <div class="row" style="justify-content:space-between; align-items:center;">
    <button id="btnStart" class="b-primario" data-icona="op"></button>
    <button id="btnLang" data-icona="idioma" title="Idioma / Language"></button>
  </div>

  <div class="grupo">
    <span class="rotulo">Operacións <em>Selecciona un modo</em></span>
    <div class="fila">
      <button id="btnOnline" class="a-verde" data-icona="duelo"></button>
      <button id="btnCrisol" class="a-ouro" data-icona="crisol"></button>
      <button id="btnMundial" class="a-ciano" data-icona="mundial"></button>
      <button id="btnLado" class="a-azul" data-icona="faccion"></button>
    </div>
  </div>

  <div class="grupo">
    <span class="rotulo">Escuadrón <em>Xestión e preparación</em></span>
    <div class="fila">
      <button id="btnMemorial" data-icona="memorial"></button>
      <button id="btnDespiece" class="a-bronce" data-icona="despece"></button>
      <button id="btnCantina" data-icona="cantina"></button>
      <button id="btnVoz" class="a-azul" data-icona="voz"></button>
    </div>
  </div>

  <div class="grupo">
    <span class="rotulo">Rexistro <em>Arquivos e historial</em></span>
    <div class="fila">
      <button id="btnDiario" class="a-bronce" data-icona="arquivo" style="display:none;"></button>
      <button id="btnCronica" data-icona="cronica"></button>
      <button id="btnExport" data-icona="export"></button>
      <button id="btnImport" data-icona="import"></button>
      <input type="file" id="importFile" accept=".json,application/json" style="display:none;">
      <button id="btnWipe" class="b-perigo" data-icona="borrar"></button>
    </div>
  </div>

  <div id="memorial" style="display:none; margin-top:12px;" class="small"></div>
  <p id="hgHelp" class="small" style="margin-top:16px;"><!-- hg.help: énchese en aplicarIdioma() --></p>
  </div><!-- /hangarCentro -->
 </div><!-- /hangarLayout -->
</div>

<!-- ===================== BATALLA ===================== -->
<div id="battle" style="display:none; width:100%; max-width:1260px;">
  <div id="battleLayout">
    <div id="wrap"><canvas id="cv" width="960" height="540"></canvas></div>
    <div id="sidePanel"><div id="spEmpty" class="small">— Sin unidad seleccionada —</div></div>
  </div>
  <div id="hud">
    <div id="prodbar" style="display:flex; gap:8px; flex-wrap:wrap;">
      <button id="p0">[1] GRUNT</button>
      <button id="p1">[2] HEAVY</button>
      <button id="p2">[3] ENGINEER</button>
      <button id="p3">[4] SNIPER</button>
      <button id="p4" class="a-bronce">[5] TANQUE 40⚙</button>
      <button id="p5">[6] BOMBARDERO</button>
      <button id="p6" class="a-bronce">[7] TORRETA 45⚙</button>
      <button id="pMuro" class="a-bronce" style="display:none;" title="O Engineer seleccionado camiña ao punto e constrúe o muro in situ (~4s exposto)">[8] MURO 10⚙ ⌂</button>
      <span id="prodinfo"></span>
      <span id="forminfo" style="padding:2px 8px; border:1px solid var(--phos-dim); font-size:11px;" title="Tecla F para alternar formación"></span>
      <span id="radarinfo" style="margin-left:auto; padding:2px 8px; border:1px solid var(--phos-dim); font-size:11px;"></span>
    </div>
    <button id="btnAbort" style="margin-left:auto;">Abortar misión</button>
  </div>
  <div id="radio"><div id="radioCanal" class="line small">— Canal de radio abierto —</div></div>
</div>

<!-- ===================== DEBRIEF ===================== -->
<div id="debrief" class="scr" style="display:none;">
  <h2 id="dbTitle">// Informe de operación</h2>
  <div id="dbBody" class="small"></div>
  <div class="row"><button id="btnBack">Volver al hangar</button></div>
</div>

<!-- ===================== BRIEFING (v0.11) ===================== -->
<div id="briefing" class="scr" style="display:none;">
  <h2 id="brTitle">// Briefing — Operación</h2>
  <div id="brBody" style="display:flex; align-items:flex-start; gap:24px; margin:32px 0; min-height:180px;">
    <canvas id="brPortrait" width="96" height="96" style="image-rendering:pixelated; border:1px solid var(--phos-dim); background:#0a0a0a; flex-shrink:0; width:96px; height:96px;"></canvas>
    <div style="flex:1; min-width:0;">
      <div id="brName" style="font-size:22px; color:var(--phos); letter-spacing:1px; margin-bottom:4px;"></div>
      <div id="brMeta" class="small" style="color:#888; margin-bottom:20px;"></div>
      <div id="brFrase" style="font-size:17px; font-style:italic; line-height:1.5; padding:14px 18px; border-left:3px solid var(--phos); background:#1a1a1a; min-height:60px;"></div>
    </div>
  </div>
  <div class="row" style="justify-content:space-between; align-items:center;">
    <span id="brProgress" class="small" style="color:#888;"></span>
    <span class="small" style="color:#888;" id="brHint">[ Espazo / Enter para continuar ]</span>
    <button id="brNext">SEGUINTE ►</button>
  </div>
</div>

<!-- ===================== MODAL BIOGRAFÍA ===================== -->
<div id="bioModal">
  <div class="inner">
    <h2 id="bioTitle"></h2>
    <div id="bioBody"></div>
    <div class="row"><button id="btnBioClose">Cerrar</button></div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/00-preambulo.js"></script>
<script src="js/00b-i18n.js"></script>
<script src="js/01-nucleo-datos.js"></script>
<script src="js/01b-assets.js"></script>
<script src="js/02-pvp-lobby.js"></script>
<script src="js/03-pvp-sync.js"></script>
<script src="js/04-progresion.js"></script>
<script src="js/05-mapa-camara-neboa.js"></script>
<script src="js/06-audio-voces.js"></script>
<script src="js/06b-voz.js"></script>
<script src="js/07-terreo-batalla.js"></script>
<script src="js/08-social-narrativa.js"></script>
<script src="js/09-economia-combate.js"></script>
<script src="js/10-estructuras.js"></script>
<script src="js/11-retratos-ui.js"></script>
<script src="js/12-debrief-hangar.js"></script>
<script src="js/13-mundial.js"></script>
<script src="js/14-diario.js"></script>
<script src="js/15-luz.js"></script>
<script src="js/16-estado.js"></script>
<script src="js/99-boot.js"></script>
</body>
</html>
